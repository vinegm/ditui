# These are all the settings you can configure in a config file.
# All values here are the defaults; omit any of them and the default is used instead.
# Empty colours use the terminal's colours.
# This file must match the defaults in internal/config/config.go.
# Command line flags override anything set here.

drill:
  mode: decode # decode (read the code, type the character) or encode (read the character, key the code)
  set: letters # letters, digits, alphanumeric or punctuation
  chars: "" # drill only these characters (like "eish5"), overriding set when not empty
  cheatsheet: false # show every code of the set under the prompt

theme:
  fg: "" # default fg for all text
  bg: "" # bg for the window
  selected: "#5a5a5a" # fg for the selected menu item, the active tab and the input prompt
  border: ""
  accent: "" # fg for the code or character being asked
  muted: "#6c6c6c" # fg for timers and secondary text
  correct: "#5faf5f" # right answers and the filled part of accuracy bars
  wrong: "#d75f5f" # wrong answers and the empty part of accuracy bars
  key_hints: "#6c6c6c" # fg for the key hints bar at the bottom
